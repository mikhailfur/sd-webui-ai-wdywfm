name: Build and Release

on:
  push:
    branches:
      - master
    paths:
      - 'build_info.json'

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Read build info
        id: get_info
        run: |
          VERSION=$(jq -r '.version' build_info.json)
          TYPE=$(jq -r '.type' build_info.json)
          DESCRIPTION=$(jq -r '.description' build_info.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "type=$TYPE" >> $GITHUB_OUTPUT
          echo "description=$DESCRIPTION" >> $GITHUB_OUTPUT

      - name: Prepare distribution folder
        run: |
          # Создаем целевую структуру папок
          mkdir -p dist/sd-webui-ai-wdywfm
          
          # Копируем файлы, исключая мусор. 
          # Файлы из корня проекта попадут в dist/sd-webui-ai-wdywfm/
          rsync -av --exclude='.git*' \
                 --exclude='__pycache__*' \
                 --exclude='*.py[co]*' \
                 --exclude='*.pyo' \
                 --exclude='*.exe' \
                 --exclude='*.dist-info' \
                 --exclude='*.egg-info' \
                 --exclude='docs/' \
                 --exclude='schemas/' \
                 --exclude='tests/' \
                 --exclude='*.md' \
                 --exclude='README*' \
                 --exclude='LICENSE' \
                 --exclude='.env' \
                 --exclude='.gitignore' \
                 --exclude='.github/' \
                 --exclude='build_info.json' \
                 --exclude='.vscode/' \
                 --exclude='.idea/' \
                 --exclude='.swp' \
                 --exclude='*.pyc' \
                 . dist/sd-webui-ai-wdywfm/

      - name: Package into ZIP
        run: |
          # Формируем имя архива динамически: v0.2-stable.zip
          ARCHIVE_NAME="v${{ steps.get_info.outputs.version }}-${{ steps.get_info.outputs.type }}.zip"
          cd dist
          # Зипуем только папку с проектом
          zip -r ../$ARCHIVE_NAME sd-webui-ai-wdywfm
          cd ..
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          # Используем динамическое имя из шага выше
          tag_name: v${{ steps.get_info.outputs.version }}
          name: Release ${{ steps.get_info.outputs.version }} (${{ steps.get_info.outputs.type }})
          body: |
            ${{ steps.get_info.outputs.description }}
            
            ## Changelog
            ${{ steps.get_info.outputs.changelog }}
          
          files: ${{ env.ARCHIVE_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
